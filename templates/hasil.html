<!DOCTYPE html>
<html>
<head>
    <title>Hasil Analisis</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">
        Hasil Analisis Sentimen
    </h2>

    <div class="alert alert-success">
        Akurasi Model:
        <strong>{{ accuracy }}%</strong>
    </div>

    <h4>Grafik Sentimen</h4>

    <img src="/{{ chart }}" class="img-fluid mb-4">

    <h4>Wordcloud</h4>

    <img src="{{ url_for('static', filename='wordcloud/positif.png') }}">

    <h4>Tabel Hasil</h4>

    <table class="table table-bordered">

        <thead>
            <tr>
                <th>Komentar</th>
                <th>Sentimen</th>
            </tr>
        </thead>

        <tbody>

            {% for row in tables %}
            <tr>
                <td>{{ row[0] }}</td>
                <td>{{ row[1] }}</td>
            </tr>
            {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
